---
name: Promote main to stable

# Two-branch model: `main` is the testing branch (publishes :stable-testing and
# :testing); `stable` is the production branch. The shared factory workflow
# opens (or refreshes) a squash promotion PR from `main` to `stable` on every
# push, daily, or when a maintainer dispatches it. A human merges that PR in
# the UI; the merge pushes `stable` and triggers build-image.yml, which
# publishes :stable.
#
# Structure mirrors projectbluefin/finpilot's promote-main-to-stable.yml, which
# solved three problems this repo hit (see upstream comments below):
#   1. The reusable's auto-enrollment path runs `gh pr merge --auto` with no
#      merge method and GitHub CLI refuses that without a TTY, so enrollment is
#      off and the PR is merged by hand.
#   2. The reusable's release gate sits behind enqueue_promotion, so the gate
#      is invoked directly here to keep cosign verification.
#   3. GitHub holds check runs for bot-authored PRs in `action_required`, and
#      scheduled approvers are throttled; an inline job approves them at once.

on:
  push:
    branches:
      - main
  schedule:
    # Daily refresh window (upstream finpilot cadence). Doubles as a backstop
    # for the check-approval job below.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  # unblock-promotion-checks needs write to approve the check runs GitHub holds
  # for a bot-authored pull request. The reusable's jobs each declare their own
  # permissions, so widening the ceiling does not hand actions: write to them.
  actions: write
  contents: write
  issues: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  # First-time forks have no `stable` branch. The factory reusable fetches
  # origin/stable and fails with exit 128 ("couldn't find remote ref stable"),
  # which opens "ci: testing→main promotion conflict". Create it once from
  # current main; later runs no-op when the ref exists.
  ensure-stable:
    name: Ensure stable branch exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create stable from main if missing
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin stable >/dev/null; then
            echo "stable already exists"
            exit 0
          fi
          git push origin "HEAD:stable"
          echo "Created stable from ${GITHUB_SHA}"

  promote:
    name: Promote main to stable
    needs: ensure-stable
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@837850b6100b22c7920476035e7e1c28fdbba67f # v1
    with:
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository }}/\.github/workflows/
      registry: ghcr.io/${{ github.repository_owner }}
      source_branch: main
      target_branch: stable
      # A personal image runs no e2e suites. The gate job below verifies the
      # current candidate's cosign signature before a human merges.
      run_e2e: false
      # The only path that auto-enrolls the PR is a merge queue, which needs an
      # organization-owned repository. Personal-account forks cannot use one.
      use_merge_queue: false
      # Enrolling without a merge queue runs `gh pr merge --auto` with no merge
      # method, and GitHub CLI refuses that without a TTY ("--merge, --rebase,
      # or --squash required when not running interactively"). The reusable
      # exposes no merge-method input, so enrollment stays off and the promotion
      # PR is merged by hand.
      #
      # Merging by hand matters beyond the merge method. A push made with the
      # github-actions token is exempt from workflow runs only for
      # workflow_dispatch and repository_dispatch events, so a bot merge would
      # never fire push-triggered build-image.yml and :stable would never
      # publish. A merge performed by a person fires it, which is why this PR
      # is merged in the UI rather than by a bot.
      enqueue_promotion: false
      # Personal-account forks do not have an <owner>/maintainers team.
      # Organization forks can enable this and optionally set `reviewer`.
      request_reviewer: false
    secrets: inherit

  # The reusable rebuilds the promotion branch by overlaying main's tree on
  # stable, then staging the paths git reports as deletions. Git reports a moved
  # file as a rename, so every path main moved survives on its old path and the
  # branch's tree stops matching main's — merging it would ship stale files on
  # :stable (observed: the dconf keyfile 6227b44 moved to a gschema override
  # reappeared at its old path). Repair it here, before a human merges the PR:
  # a commit carrying main's tree on top of stable, the shape the reusable
  # intends. Skipped when the tree already matches, so a correct branch never
  # loses its approvals to a no-op force-push.
  repair-promotion-branch:
    name: Make the promotion branch match main
    needs: [promote]
    if: needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Rebuild the branch when its tree has drifted from main
        shell: bash
        run: |
          set -euo pipefail

          # Fetch stable/main first; the promotion branch may not exist yet
          # (nothing to promote) — upstream fetches all three in one call,
          # which fails hard on the missing branch.
          git fetch origin main stable
          git fetch origin "${PROMOTION_BRANCH}" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Repair the branch the reusable built. A missing branch means there
          # was nothing to promote, so there is nothing to repair.
          if ! git rev-parse --verify --quiet "origin/${PROMOTION_BRANCH}" >/dev/null; then
            echo "::notice::No ${PROMOTION_BRANCH} to repair."
            exit 0
          fi

          head_tree=$(git rev-parse "origin/${PROMOTION_BRANCH}^{tree}")
          main_tree=$(git rev-parse "origin/main^{tree}")
          if [ "${head_tree}" = "${main_tree}" ]; then
            echo "::notice::${PROMOTION_BRANCH} already matches main."
            exit 0
          fi

          commit=$(git commit-tree "${main_tree}" -p origin/stable -m "chore: promote main to stable")
          git push --force origin "${commit}:refs/heads/${PROMOTION_BRANCH}"
          echo "Rebuilt ${PROMOTION_BRANCH} from main's tree."

  # The reusable declares no workflow-level outputs, so the promotion PR is
  # found by its deterministic head/base pair: reusable-promote-squash derives
  # auto/promote-<source>-to-<target> from the branch-model inputs. A no-op run,
  # where main and stable already match, has no PR at all. Two jobs need the
  # number — the approver below and the gate — so look it up once.
  locate-promotion-pr:
    name: Locate the promotion PR
    needs: [promote, repair-promotion-branch]
    if: needs.promote.result == 'success' && needs.repair-promotion-branch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.find.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Find the open promotion PR
        id: find
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base stable \
            --head "${PROMOTION_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::No open promotion PR."
          fi

  # GitHub holds every check run it creates for a bot-authored pull request in
  # `action_required` until someone approves it, so the promotion PR's own
  # validation reports nothing until then. Without the approval the checks
  # effectively never run — and scheduled approvers are throttled to hours —
  # so this job approves them seconds after the branch is pushed. If one is
  # ever missed, approve it from the run's page.
  unblock-promotion-checks:
    name: Unblock the promotion PR's checks
    needs: [locate-promotion-pr]
    if: needs.locate-promotion-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Approve pending runs on the promotion branch
        shell: bash
        run: |
          set -euo pipefail

          # The same trust boundary the factory approver documents: only runs
          # on the bot-owned promotion branch, from the bot itself. Those
          # branches carry only commits that already passed their own PR checks.
          #
          # Approve only runs pinned to the branch's CURRENT head. The
          # repair-promotion-branch force-push lands seconds after the
          # reusable's rebuild, so action_required runs for both the old and
          # the new head are listed at once; approving both makes them race
          # for the same PR-number concurrency group and can cancel the
          # current head's runs with nothing left running (observed on
          # PR #26, 2026-09-20). Stale-head runs are superseded and must
          # never run.
          branch_head=$(gh api "repos/${{ github.repository }}/git/ref/heads/${PROMOTION_BRANCH}" \
            --jq '.object.sha')
          runs_filter=".workflow_runs[] | select(.head_branch == \"${PROMOTION_BRANCH}\") | select(.head_sha == \"${branch_head}\") | select(.actor.login == \"github-actions[bot]\") | .id"

          approved=0
          # Runs for a freshly pushed branch appear a few seconds after the
          # push, so retry briefly instead of reporting nothing to do.
          for attempt in 1 2 3 4 5 6; do
            mapfile -t run_ids < <(
              gh api "repos/${{ github.repository }}/actions/runs?status=action_required&per_page=100" \
                --jq "${runs_filter}"
            )

            if [ "${#run_ids[@]}" -gt 0 ]; then
              for run_id in "${run_ids[@]}"; do
                if gh api -X POST "repos/${{ github.repository }}/actions/runs/${run_id}/approve" >/dev/null; then
                  echo "Approved run ${run_id}"
                  approved=$((approved + 1))
                else
                  echo "::warning::Could not approve run ${run_id}"
                fi
              done
              break
            fi

            if [ "${attempt}" -lt 6 ]; then
              sleep 15
            fi
          done

          if [ "${approved}" -eq 0 ]; then
            echo "::notice::No pending runs matched; nothing to approve."
          fi

  # The reusable's own release gate sits behind `enqueue_promotion`, which is
  # off because a personal repository cannot enroll a promotion for merge. That
  # input is a master switch for both the gate and the enrollment job, so
  # turning enrollment off turned the gate off too. Run the same gate here, so
  # the promotion PR is still verified and labelled before a human merges it.
  gate:
    name: Release gate checks
    needs: [locate-promotion-pr]
    if: needs.locate-promotion-pr.outputs.pr_number != ''
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-release-gate.yml@837850b6100b22c7920476035e7e1c28fdbba67f # v1
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ needs.locate-promotion-pr.outputs.pr_number }}
      registry: ghcr.io/${{ github.repository_owner }}
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository }}/\.github/workflows/
      target_tag: testing
      # head_sha and the e2e_* inputs are deliberately omitted: they feed only
      # the commit-bound E2E check, which run_e2e: false disables. Add them if
      # e2e is ever enabled for this image.
      run_e2e: false
    secrets: inherit
