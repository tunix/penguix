name: Validate Brewfiles
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom/brew/**"
      - "scripts/validate-brewfiles.sh"
      - "tests/unit/validate-brewfiles_test.bats"
      - ".github/workflows/validate-brewfiles.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # master

      # Static validation only: the script greps Brewfiles and passes names
      # to `brew info` as data. Never `brew bundle check` a PR-controlled
      # Brewfile — it is a Ruby DSL and would execute in CI (see #288).
      - name: Validate Brewfiles
        shell: bash
        run: bash scripts/validate-brewfiles.sh
