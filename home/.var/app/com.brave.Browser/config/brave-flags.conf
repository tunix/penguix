# Brave flatpak flags (applied by cobalt on launch).
#
# Verified 2026-11 against upstream Chromium main and Brave 1.100:
# - --ozone-platform=wayland: still required. The "Preferred Ozone platform"
#   flag was removed from brave://flags (brave-browser#52958) and upstream
#   only parses --ozone-platform (ui/ozone/platform_selection.cc), so without
#   this line Brave runs under XWayland.
# - WebRtcPipeWireCamera: still FEATURE_DISABLED_BY_DEFAULT upstream
#   (media/capture/capture_switches.cc) — needed for Wayland camera capture.
# Dropped (no longer needed):
# - UseOzonePlatform: the feature no longer exists upstream; Chromium builds
#   are ozone-only and --ozone-platform above is the canonical switch.
# - TouchpadOverscrollHistoryNavigation: FEATURE_ENABLED_BY_DEFAULT on Linux
#   (content/common/features.cc).
--ozone-platform=wayland
--enable-features=WebRtcPipeWireCamera
