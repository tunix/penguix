[org/gnome/desktop/app-folders]
# folder-children from the dump equals what gnome-shell writes itself
# (appDisplay.js DEFAULT_FOLDERS: System/Utilities/YaST/Pardus) PLUS the six
# folders bluefin's common ships (01-bluefin-folders). dakota ships NO
# app-folders and gnome-shell only auto-creates its own set, so penguix
# carries the bluefin-style folder layout: stock System/Utilities
# (shell-generated content from the dump) + the six common folders. YaST and
# Pardus are upstream openSUSE/Pardus integration folders (they are in
# gnome-shell's DEFAULT_FOLDERS!) — dropped, empty on bluefin/dakota.
folder-children=['System', 'Utilities', 'Containers', 'Development', 'Games', 'GamingUtilities', 'Productivity', 'Wine']

[org/gnome/desktop/app-folders/folders/Containers]
apps=['io.github.dvlv.boxbuddyrs.desktop', 'com.github.marhkb.Pods.desktop']
categories=['Distrobox']
name='Containers'
translate=false

[org/gnome/desktop/app-folders/folders/Development]
apps=['dev-pod.desktop', 'code.desktop', 'virt-manager.desktop', 'io.podman_desktop.PodmanDesktop.desktop']
categories=['Development', 'IDE']
excluded-apps=['org.gnome.Sysprof.desktop']
name='Development'
translate=false

[org/gnome/desktop/app-folders/folders/Games]
categories=['Game']
excluded-apps=['steam.desktop', 'net.lutris.Lutris.desktop', 'io.github.benjamimgois.goverlay.desktop', 'com.vysp3r.ProtonPlus.desktop', 'io.github.fastrizwaan.WineZGUI.desktop']
name='Games'
translate=false

[org/gnome/desktop/app-folders/folders/GamingUtilities]
apps=['protontricks.desktop', 'discover_overlay_configure.desktop', 'com.vysp3r.ProtonPlus.desktop', 'io.github.benjamimgois.goverlay.desktop', 'com.gerbilsoft.rom-properties.rp-config.desktop', 'steamos-nested-desktop.desktop']
name='Gaming Utilities'
translate=false

[org/gnome/desktop/app-folders/folders/Productivity]
apps=['simple-scan.desktop', 'org.gnome.Papers.desktop', 'org.gnome.Connections.desktop']
name='Productivity'
translate=false

[org/gnome/desktop/app-folders/folders/System]
apps=['org.gnome.DejaDup.desktop', 'org.gnome.baobab.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.Logs.desktop', 'org.freedesktop.MalcontentControl.desktop', 'org.gnome.Sysprof.desktop', 'org.gnome.tweaks.desktop']
name='X-GNOME-Shell-System.directory'
translate=true

[org/gnome/desktop/app-folders/folders/Utilities]
apps=['org.gnome.Connections.desktop', 'org.gnome.Papers.desktop', 'org.gnome.FileRoller.desktop', 'org.gnome.font-viewer.desktop', 'org.gnome.Loupe.desktop']
categories=['X-GNOME-Utilities']
name='X-GNOME-Shell-Utilities.directory'
translate=true

[org/gnome/desktop/app-folders/folders/Wine]
apps=['winetricks.desktop']
categories=['X-Wine', 'wine-wine']
name='Wine'
translate=false

[org/gnome/shell]
# Derived from `dconf dump` (2026-11) and re-verified against the live
# gnome-extensions list: nightthemeswitcher removed (dead upstream, max
# GNOME 3.38). solaar-extension kept: EGO supports GNOME 50/51 and it talks
# to flatpak solaar over its exported session dbus interface
# (io.github.pwr_solaar/solaar). search-light stays disabled; its
# tuned settings are kept in extensions.ini.
# Color-scheme scheduling is NOT an extension: penguix-sun-scheduler (a
# systemd user timer, sun-based with a 09:00/18:00 fallback) handles it.
enabled-extensions=['gsconnect@andyholmes.github.io', 'grand-theft-focus@zalckos.github.com', 'tilingshell@ferrarodomenico.com', 'caffeine@patapon.info', 'appindicatorsupport@rgcjonas.gmail.com', 'gradia-integration@alexandervanhee.github.io', 'blur-my-shell@aunetx', 'tailscale-gnome-qs@tailscale-qs.github.io', 'solaar-extension@sidevesh']
favorite-apps=['com.brave.Browser.desktop', 'org.gnome.Nautilus.desktop', 'com.spotify.Client.desktop', 'com.mitchellh.ghostty.desktop', 'io.github.kolunmi.Bazaar.desktop', 'org.gnome.Settings.desktop', 'org.telegram.desktop.desktop', 'io.github.tobagin.karere.desktop', 'com.discordapp.Discord.desktop', 'md.obsidian.Obsidian.desktop']

[org/gnome/shell/weather]
automatic-location=true
locations=[<(uint32 2, <('Izmir-Adnan Menderes Airport', 'LTBJ', false, [(0.66787933291426083, 0.47385689191646041)], @a(dd) [])>)>]

[org/gnome/system/location]
enabled=true
