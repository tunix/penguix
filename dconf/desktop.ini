[org/gnome/desktop/background]
picture-uri='file:///var/home/tunix/.config/background'
picture-uri-dark='file:///var/home/tunix/.config/background'

[org/gnome/desktop/datetime]
automatic-timezone=true

[org/gnome/desktop/input-sources]
sources=[('xkb', 'tr')]

[org/gnome/desktop/interface]
accent-color='teal'
clock-show-weekday=true
color-scheme='prefer-light'
cursor-theme='Yaru'
document-font-name='MonoLisaText 12'
enable-hot-corners=false
font-antialiasing='rgba'
font-name='MonoLisaText 11'
monospace-font-name='MonoLisaCode 12'
text-scaling-factor=0.90000000000000002

[org/gnome/desktop/peripherals/touchpad]
send-events=true
speed=0.12554112554112562

[org/gnome/desktop/privacy]
old-files-age=3
remove-old-temp-files=true
remove-old-trash-files=true

[org/gnome/desktop/sound]
allow-volume-above-100-percent=true

[org/gnome/desktop/wm/keybindings]
maximize=@as []
move-to-workspace-down=@as []
move-to-workspace-left=['<Super><Shift>Page_Up', '<Super><Shift>KP_Prior', '<Super><Shift><Alt>Left']
move-to-workspace-right=['<Super><Shift>Page_Down', '<Super><Shift>KP_Next', '<Super><Shift><Alt>Right']
move-to-workspace-up=@as []
switch-to-workspace-down=@as []
switch-to-workspace-left=['<Super>Page_Up', '<Super>KP_Prior', '<Super><Alt>Left']
switch-to-workspace-right=['<Super>Page_Down', '<Super>KP_Next', '<Super><Alt>Right']
switch-to-workspace-up=@as []
unmaximize=@as []

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/mutter]
center-new-windows=true
edge-tiling=false
workspaces-only-on-primary=false

[org/gnome/mutter/keybindings]
toggle-tiled-left=@as []
toggle-tiled-right=@as []

[org/gnome/nautilus/icon-view]
default-zoom-level='small-plus'

[org/gnome/nautilus/preferences]
default-folder-viewer='icon-view'
migrated-gtk-settings=true

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=true
night-light-temperature=2700

[org/gnome/settings-daemon/plugins/media-keys]
calculator=['<Super>c']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']
home=['<Super>f']
volume-step=2
www=['<Super>b']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>t'
command='ghostty'
name='Start Ghostty'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Ctrl><Shift>Space'
command='/home/linuxbrew/.linuxbrew/bin/1password --quick-access'
name='1Password Quick Access'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Control><Shift>Escape'
command='flatpak run io.missioncenter.MissionCenter'
name='mission-center'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3]
binding='<Control><Alt>BackSpace'
command='flatpak run com.jeffser.Alpaca'
name='Launch Alpaca'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom5]
binding='<Control><Alt>space'
command='flatpak run it.mijorus.smile'
name='Open up the emoji picker'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom6]
binding='<Super>period'
command='flatpak run it.mijorus.smile'
name='Open up the emoji picker (Alt)'

[org/gnome/settings-daemon/plugins/power]
power-button-action='nothing'
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-timeout=900
sleep-inactive-battery-type='suspend'

[org/gnome/tweaks]
show-extensions-notice=false

[org/gtk/gtk4/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
sort-column='name'
sort-directories-first=true
sort-order='ascending'
type-format='category'
view-type='list'

[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sort-column='name'
sort-directories-first=true
sort-order='ascending'
type-format='category'
