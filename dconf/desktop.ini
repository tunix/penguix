[org/gnome/desktop/background]
picture-uri='file:///var/home/tunix/.config/background'
picture-uri-dark='file:///var/home/tunix/.config/background'

[org/gnome/desktop/datetime]
automatic-timezone=true

[org/gnome/desktop/input-sources]
sources=[('xkb', 'tr')]

[org/gnome/desktop/interface]
accent-color='teal'
color-scheme='prefer-light'
cursor-theme='Bibata-Modern-Ice'
document-font-name='MonoLisaText 12'
font-name='MonoLisaText 11'
monospace-font-name='MonoLisaCode 12'
text-scaling-factor=0.90000000000000002

[org/gnome/desktop/peripherals/touchpad]
send-events=true
speed=0.12554112554112562

[org/gnome/desktop/privacy]
old-files-age=3
remove-old-temp-files=true
remove-old-trash-files=true

[org/gnome/desktop/sound]
allow-volume-above-100-percent=true

[org/gnome/desktop/wm/keybindings]
# Ghostty split navigation vs workspace switching. maximize/unmaximize are
# NOT here: tilingshell writes them itself via its overridden-settings.
move-to-workspace-down=@as []
move-to-workspace-left=['<Super><Shift>Page_Up', '<Super><Shift>KP_Prior', '<Super><Shift><Alt>Left']
move-to-workspace-right=['<Super><Shift>Page_Down', '<Super><Shift>KP_Next', '<Super><Shift><Alt>Right']
move-to-workspace-up=@as []
switch-to-workspace-down=@as []
switch-to-workspace-left=['<Super>Page_Up', '<Super>KP_Prior', '<Super><Alt>Left']
switch-to-workspace-right=['<Super>Page_Down', '<Super>KP_Next', '<Super><Alt>Right']
switch-to-workspace-up=@as []

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/mutter]
# edge-tiling / toggle-tiled-* are NOT here: tilingshell owns and rewrites
# them via its overridden-settings.
workspaces-only-on-primary=false

[org/gnome/nautilus/icon-view]
default-zoom-level='small-plus'

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=true
night-light-temperature=2700

[org/gnome/settings-daemon/plugins/media-keys]
# Additive over the base image. dakota ships slots custom0..custom6 (list in
# files/dconf/06-dakota-keybindings; custom0/1 = xdg-terminal-exec on
# Ctrl+Alt+t / Ctrl+Alt+Return, custom4 = vicinae on Super+space, 2/3/5/6
# from common's 02). dconf cannot merge lists, so this user-db list restates
# the image slots and appends penguix's own — nothing upstream is clobbered.
# If the image adds slots, extend this list accordingly.
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom4/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom5/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom6/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom10/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom11/']
calculator=['<Super>c']
home=['<Super>f']
volume-step=2
www=['<Super>b']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom10]
binding='<Super>t'
command='ghostty'
name='Start Ghostty'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom11]
binding='<Ctrl><Shift>Space'
command='/home/linuxbrew/.linuxbrew/bin/1password --quick-access'
name='1Password Quick Access'
# High slot numbers (10+) are reserved for penguix; custom0..9 belong to the
# image. Definitions here override content only if the slot coincides.

[org/gnome/settings-daemon/plugins/power]
power-button-action='nothing'
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-timeout=900
sleep-inactive-battery-type='suspend'

[org/gnome/tweaks]
show-extensions-notice=false

[org/gtk/gtk4/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
sort-column='name'
sort-directories-first=true
sort-order='ascending'
type-format='category'
view-type='list'

[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sort-column='name'
sort-directories-first=true
sort-order='ascending'
type-format='category'
