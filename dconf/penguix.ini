# penguix per-user desktop settings.
# Applied with: dconf load / < dconf/penguix.ini  (just penguix-dconf-apply)
#
# This is the user dconf database — not the system db from the old image
# build — so every key here is user-owned and survives OS rebases and
# bootc switches untouched.
#
# Format note: dconf dump/load keyfile syntax (GVariant values), identical
# to the old distro.d keyfile format, so the old settings carried over 1:1.

[org/gnome/desktop/background]
picture-options = 'zoom'
primary-color = '000000'
secondary-color = 'FFFFFF'

[org/gnome/desktop/interface]
accent-color = 'teal'
enable-hot-corners = false
clock-format = '24h'
clock-show-date = true
clock-show-weekday = true
cursor-theme = "Yaru"
text-scaling-factor = 0.9
monospace-font-name = 'JetBrains Mono Regular 11'

[org/gnome/desktop/wm/preferences]
button-layout = 'appmenu:minimize,maximize,close'

[org/gnome/desktop/wm/keybindings]
# Unbind Ctrl+Alt arrows so Ghostty split navigation can use them.
switch-to-workspace-left = ['<Super>Page_Up', '<Super>KP_Prior', '<Super><Alt>Left']
switch-to-workspace-right = ['<Super>Page_Down', '<Super>KP_Next', '<Super><Alt>Right']
switch-to-workspace-up = @as []
switch-to-workspace-down = @as []
move-to-workspace-left = ['<Super><Shift>Page_Up', '<Super><Shift>KP_Prior', '<Super><Shift><Alt>Left']
move-to-workspace-right = ['<Super><Shift>Page_Down', '<Super><Shift>KP_Next', '<Super><Shift><Alt>Right']
move-to-workspace-up = @as []
move-to-workspace-down = @as []

[org/gnome/desktop/sound]
allow-volume-above-100-percent = true
event-sounds = true
theme-name = "freedesktop"

[org/gnome/desktop/peripherals/keyboard]
repeat = true
repeat-interval = 30

[org/gnome/desktop/peripherals/touchpad]
tap-to-click = true
send-events = true
natural-scroll = true
two-finger-scrolling-enabled = true
disable-while-typing = true

[org/gnome/desktop/peripherals/mouse]
natural-scroll = false

[org/gnome/desktop/privacy]
remove-old-trash-files = true
remove-old-temp-files = true
old-files-age = 3

[org/gtk/settings/file-chooser]
sort-directories-first = true

[org/gtk/gtk4/settings/file-chooser]
sort-directories-first = true
sort-order = 'ascending'

[org/gnome/desktop/datetime]
automatic-timezone = true

[org/gnome/mutter]
workspaces-only-on-primary = false
center-new-windows = true

[org/gnome/nautilus/icon-view]
default-zoom-level = 'small-plus'

[org/gnome/nautilus/window-state]
initial-size = (1210, 750)

[org/gnome/tweaks]
show-extensions-notice = false

[org/gnome/Ptyxis]
interface-style = 'system'
restore-session = false

[org/gnome/settings-daemon/plugins/color]
night-light-enabled = true
night-light-temperature = 2700

[org/gnome/settings-daemon/plugins/power]
power-button-action = 'nothing'
sleep-inactive-ac-timeout = 0
sleep-inactive-ac-type = 'nothing'
sleep-inactive-battery-timeout = 900
sleep-inactive-battery-type = 'suspend'

[org/gnome/settings-daemon/plugins/media-keys]
home = ['<Super>f']
www = ['<Super>b']
calculator = ['<Super>c']
custom-keybindings = ['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']
volume-step = 2

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding = '<Super>t'
command = 'ghostty'
name = 'Start Ghostty'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding = '<Ctrl><Shift>Space'
command = '/home/linuxbrew/.linuxbrew/bin/1password --quick-access'
name = '1Password Quick Access'

# GNOME Shell
[org/gnome/shell]
favorite-apps = ['com.brave.Browser.desktop', 'org.gnome.Nautilus.desktop', 'com.spotify.Client.desktop', 'com.mitchellh.ghostty.desktop', 'io.github.kolunmi.Bazaar.desktop', 'org.gnome.Settings.desktop', 'org.telegram.desktop.desktop', 'com.slack.Slack.desktop', 'com.discordapp.Discord.desktop', 'md.obsidian.Obsidian.desktop']
# solaar-extension dropped (solaar now runs as a flatpak; its own tray icon
# suffices). nightthemeswitcher dropped (upstream dead at GNOME 3.38;
# theme-scheduler@lsbcodes replaces it, schedule configured via its GUI on
# first run). Image-shipped extensions (tilingshell, tailscale-qs,
# appindicator, blur-my-shell, gsconnect, caffeine, ...) come from the base
# image; user-installed ones (search-light, theme-scheduler,
# grand-theft-focus) are enabled by `just penguix-extensions`.
enabled-extensions = ['appindicatorsupport@rgcjonas.gmail.com', 'blur-my-shell@aunetx', 'gsconnect@andyholmes.github.io', 'tailscale-gnome-qs@tailscale-qs.github.io', 'search-light@icedman.github.com', 'theme-scheduler@lsbcodes', 'grand-theft-focus@zalckos.github.com', 'tilingshell@ferrarodomenico.com', 'caffeine@patapon.info']

[org/gnome/system/location]
enabled = true

[org/gnome/shell/weather]
automatic-location = true
locations = [<(uint32 2, <('Izmir-Adnan Menderes Airport', 'LTBJ', false, [(0.66787933291426083, 0.47385689191646041)], @a(dd) [])>)>]

[org/gnome/desktop/input-sources]
sources = [('xkb', 'tr')]

# Extension settings
[org/gnome/shell/extensions/appindicator]
tray-pos = 'left'

[org/gnome/shell/extensions/search-light]
shortcut-search = ['<Super>space']
scale-width = 0.10
scale-height = 0.15
border-thickness = 1
border-radius = 1.65
border-color = (0.23, 0.23, 0.23, 1.0)
background-color = (0.0, 0.0, 0.0, 0.8)

[org/gnome/shell/extensions/vitals]
alphabetize = true
hot-sensors = ['_processor_usage_', '_memory_usage_', '__network-rx_max__', '__network-tx_max__']
position-in-panel = 2
show-storage = false
show-system = true

# nightthemeswitcher sections removed: the extension is dead upstream
# (stopped at GNOME 3.38). theme-scheduler@lsbcodes replaces it; its
# schedule lives in its own extension schema — configure it once via the
# extension preferences GUI, then run `just penguix-dconf-backup` to keep
# a proposal copy in the repo.

[org/gnome/shell/extensions/hidetopbar]
enable-active-window = false
mouse-sensitive = true
mouse-sensitive-fullscreen-window = false

[org/gnome/shell/extensions/blur-my-shell/panel]
brightness = 0.6
force-light-text = true
override-background = true
override-background-dynamically = true
override-background-dynamically-mode = 1
sigma = 10
static-blur = false
style-panel = 1
unblur-in-overview = true

[org/gnome/shell/extensions/blur-my-shell/popup]
blur = false

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur = false

[org/gnome/shell/extensions/blur-my-shell/dash-to-panel]
blur-original-panel = false
