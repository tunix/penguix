[io/github/tunix/rtv]
last-source='1'
volume=1.0

[io/github/tunix/valhalla]
active-source='bing'
screen-geometry='3840x2160'

[org/fedoraproject/FirewallConfig]
show-active-bindings=true
show-ipsets=true

[org/gnome/Ptyxis]
audible-bell=false
cursor-shape='underline'
interface-style='system'
restore-session=false
restore-window-size=true
